<p class="sub">Looks for 4 bug types only: SQL injection, XSS, command injection and hardcoded secrets. It keeps looping until none are left. All samples are made up and every key is fake.</p>

 const top=topSplit(c.arg,','),ps=parts(top[0],'py');if(!ps)return null;

 return[line.slice(0,c.m.index)+nm+'['+toArgs(ps).join(', ')+']'+(ex.length?', '+ex.join(', '):'')+')'+(pop?'.stdout':'')+c.post.slice(1).replace(/^\.read\(\)/,'')]},

const HDR={py:{os:'import os',subprocess:'import subprocess',html:'import html'},java:{ps:'import java.sql.PreparedStatement;'},c:{unistd:'#include <unistd.h>',wait:'#include <sys/wait.h>',types:'#include <sys/types.h>',stdlib:'#include <stdlib.h>'}};

 const man=R.F1.map(f=>`<li>Line ${f.i+1}, ${f.r.n}: <code>${esc(f.line.trim())}</code>. ${f.r.fix}.</li>`).join('');
 $('#rp').hidden=false;$('#rp').innerHTML=`<h3>📋 Report: patch + evidence</h3><p class="sum ${ok?'ok':'warn'}">${nb?(ok?`✅ All ${nb} bug${nb>1?'s':''} fixed in ${R.rounds.length} round${R.rounds.length>1?'s':''}`:`⚠️ ${nb-R.F1.length} of ${nb} fixed. ${R.F1.length} need a manual fix`):'✅ No SQL injection, XSS, command injection or hardcoded secret found'}</p>
 ${man?`<ul>${man}</ul>`:''}<table><tr><th>Bug type</th><th>Before</th><th>After</th><th>Exploit test</th></tr>${ty}</table>
 <table style="margin-top:10px"><tr><th>Existing checks</th><th>Baseline</th><th>After patch</th></tr>${tr}</table>
 <h3 style="margin-top:12px">Patch (diff)</h3><div class="diff">${R.diff.map(d=>`<div class="${d.t==='-'?'m':d.t==='+'?'p':''}">${d.t==='='?'  ':d.t+' '}${esc(d.s)}</div>`).join('')}</div>
 <h3 style="margin-top:12px">Fixed code</h3><textarea id="fx" readonly aria-label="Fixed code">${esc(R.out)}</textarea>
 <div class="row"><button id="cp">📋 Copy fixed code</button><button class="alt" id="dl">⬇ Download</button></div>
 <p class="sub">Exploit tests and checks here are pattern-based, not your project's real test suite. Run your own tests before you merge.</p>`;
 fixedCode=R.out;$('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(fixedCode);cap('Fixed code copied.')};
 $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fixedCode],{type:'text/plain'}));a.download='fixed.'+R.lang;a.click()}}
async function run(){if(busy)return;const code=$('#src').value;if(!code.trim()){cap('Paste some code first, or press a sample button.');return}
 let lang=$('#lang').value;if(lang==='auto')lang=pickLang(code).lang;if(!lang){cap('I could not tell the language. Pick one in the menu and run again.');return}
 busy=true;$('#go').disabled=true;$('#pc').hidden=false;$('#rp').hidden=true;$('#log').innerHTML='';$('#rd').textContent='';
 const R=pipeline(code,lang);cap(`Language: ${LN[lang].split(' ')[1]}. Running the fix loop...`);
 mark(0);log('BASELINE: '+R.t0.map(t=>(t.ok?'✓ ':'✗ ')+t.n).join(' | '));log(`BASELINE: recorded ${R.F0.length} bug${R.F0.length===1?'':'s'}${R.F0.length?': '+brief(R.F0):''}`,R.F0.length?'bad':'good');await sleep(600);
 for(const rd of R.rounds){$('#rd').textContent='Round '+rd.n;mark(1);log(`R${rd.n} LOCATE: ${rd.found.length} found: ${brief(rd.found)}`,'bad');await sleep(550);
  mark(2);log(`R${rd.n} PATCH: applied ${rd.fixed} minimal fix${rd.fixed===1?'':'es'}`+(rd.manual.length?`, ${rd.manual.length} could not be patched automatically`:''));await sleep(550);
  mark(3);log(`R${rd.n} PROVE: re-scan shows ${rd.left} left`+(rd.left?'. Looping again...':'. All exploit checks flipped to pass.'),rd.left?'mute':'good');await sleep(550)}
 mark(4);await sleep(300);mark(5);report(R);log(R.F1.length?`REPORT: stopped with ${R.F1.length} unresolved.`:'REPORT: done. Patch and evidence below.',R.F1.length?'bad':'good');
 cap(R.F0.length?(R.F1.length?`Fixed ${R.F0.length-R.F1.length} of ${R.F0.length}. ${R.F1.length} need manual review.`:`All ${R.F0.length} bugs fixed in ${R.rounds.length} round${R.rounds.length>1?'s':''}.`):'No bugs of these 4 types found.');
 busy=false;$('#go').disabled=false}
$('#go').onclick=run;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{$('#src').value=SAMPLES[b.dataset.s];$('#lang').value='auto';run()});
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#src').value=r.result;run()};r.readAsText(f)};
coverage();cap('Press a sample button, or paste your code and press "Run fixer".')}
</script></body></html>
